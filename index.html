<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEET 2026 Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.container {
  max-width: 400px;
}

/* Neon glow effect */
h1 {
  color: #00ffe0;
  text-shadow: 0 0 10px #00ffe0, 0 0 20px #00ffe0;
}

#timer {
  font-size: 2.8rem;
  margin: 15px 0;
  color: #ff4dff;
  text-shadow: 0 0 10px #ff4dff, 0 0 20px #ff4dff;
}

#quote {
  margin-top: 15px;
  font-style: italic;
  color: #ffd700;
  text-shadow: 0 0 8px #ffd700;
}

/* Button */
button {
  margin-top: 20px;
  padding: 10px 15px;
  border: none;
  border-radius: 5px;
  background: #00ffe0;
  color: #000;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 0 10px #00ffe0;
}

button:hover {
  background: #00ccaa;
}
</style>
</head>

<body>

<div class="container">
  <h1>⏳ NEET 2026</h1>
  <div id="timer">Loading...</div>
  <div id="quote"></div>

  <button onclick="toggleSound()">🎵 Focus Sound</button>
  <audio id="bgSound" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
const targetDate = new Date("2026-05-03T14:00:00").getTime();

const quotes = [
  "Stay focused. Stay sharp.",
  "Every second counts now.",
  "Discipline creates freedom.",
  "You didn’t come this far to stop.",
  "Make it happen."
];

function updateTimer() {
  const now = new Date().getTime();
  const diff = targetDate - now;

  if (diff <= 0) {
    document.body.innerHTML = "<h1 style='color:#00ffcc'>🎉 Go crush NEET!</h1>";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").innerHTML =
    `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

function updateQuote() {
  const random = Math.floor(Math.random() * quotes.length);
  document.getElementById("quote").innerText = quotes[random];
}

function toggleSound() {
  const audio = document.getElementById("bgSound");
  if (audio.paused) audio.play();
  else audio.pause();
}

setInterval(updateTimer, 1000);
setInterval(updateQuote, 4000);

updateTimer();
updateQuote();
</script>

</body>
</html>
